stages:
  - build
  - lint
  - test
  - security
  - publish

variables:
  IMAGE_NAME: quay.io/rtraceio/flink
  SDK_IMAGE: mcr.microsoft.com/dotnet/sdk:10.0

build:
  stage: build
  image:
    name: $SDK_IMAGE
  script:
    - dotnet restore --locked-mode
    - dotnet build --no-restore

build-image-amd64:
  stage: build
  image: quay.io/podman/stable
  tags:
    - saas-linux-small-amd64
  script:
    - podman login -u="$QUAY_CR_USERNAME" -p="$QUAY_CR_PASSWORD" quay.io
    - podman build -t quay.io/rtraceio/flink:$CI_COMMIT_SHA-amd64-test -f Flink/Dockerfile .
    - podman push quay.io/rtraceio/flink:$CI_COMMIT_SHA-amd64-test

hadolint:
  stage: lint
  image: alpine:latest
  before_script:
  - wget -qO - https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64 -O /usr/local/bin/hadolint
  - chmod +x /usr/local/bin/hadolint
  script:
  - hadolint ./Flink/Dockerfile

code-quality:
  stage: lint
  image:
    name: $SDK_IMAGE
  script:
    - dotnet restore --locked-mode
    - dotnet build --no-restore -warnaserror
    - dotnet tool install --global dotnet-format
    - export PATH="$PATH:/root/.dotnet/tools"
    - dotnet build --no-restore -p:ErrorLog=analysis.sarif
    - apt-get update && apt-get install -y jq
    - |
      jq '[
        .runs[].results[] |
        {
          description: .message.text,
          fingerprint: (.ruleId + "-" + (.locations[0].physicalLocation.artifactLocation.uri // "")),
          severity: (if .level=="error" then "major" else "minor" end),
          location: {
            path: .locations[0].physicalLocation.artifactLocation.uri,
            lines: { begin: .locations[0].physicalLocation.region.startLine }
          }
        }
      ]' analysis.sarif > gl-code-quality-report.json
  artifacts:
    reports:
      codequality: gl-code-quality-report.json

unit-test:
  stage: test
  dependencies:
    - build
  image:
    name: $SDK_IMAGE
  script:
    - apt-get update -y && apt-get install bc -y
    - cd Flink.UnitTests/
    - dotnet test -c Debug --results-directory ./cobertura --collect:"XPlat Code Coverage" --test-adapter-path:. --logger:"junit;LogFilePath=unit-test-result.xml;MethodFormat=Class;FailureBodyFormat=Verbose"
    - ../calc-codecov.sh "$CI_PROJECT_DIR/Flink.UnitTests/cobertura/"
  coverage: /TOTAL_COVERAGE=(\d+.\d+)/
  artifacts:
    when: always
    paths:
      - $CI_PROJECT_DIR/Flink.UnitTests/unit-test-result.xml
      - $CI_PROJECT_DIR/Flink.UnitTests/cobertura/**/coverage.cobertura.xml
    reports:
      junit:
        - $CI_PROJECT_DIR/Flink.UnitTests/unit-test-result.xml
      coverage_report:
        coverage_format: cobertura
        path: $CI_PROJECT_DIR/Flink.UnitTests/cobertura/**/coverage.cobertura.xml

integration-test:
  stage: test
  dependencies:
    - build
  image:
    name: $SDK_IMAGE
  script:
    - apt-get update -y && apt-get install bc -y
    - cd Flink.IntegrationTests/
    - dotnet test -c Debug --results-directory ./cobertura --collect:"XPlat Code Coverage" --test-adapter-path:. --logger:"junit;LogFilePath=integration-test-result.xml;MethodFormat=Class;FailureBodyFormat=Verbose"
    - ../calc-codecov.sh "$CI_PROJECT_DIR/Flink.IntegrationTests/cobertura/"
  coverage: /TOTAL_COVERAGE=(\d+.\d+)/
  artifacts:
    when: always
    paths:
      - $CI_PROJECT_DIR/Flink.IntegrationTests/integration-test-result.xml
      - $CI_PROJECT_DIR/Flink.IntegrationTests/cobertura/**/coverage.cobertura.xml
    reports:
      junit:
        - $CI_PROJECT_DIR/Flink.IntegrationTests/integration-test-result.xml
      coverage_report:
        coverage_format: cobertura
        path: $CI_PROJECT_DIR/Flink.IntegrationTests/cobertura/**/coverage.cobertura.xml

trivy-fs-scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --exit-code 1 --severity HIGH,CRITICAL --no-progress .
  allow_failure: false

trivy-image-scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs:
    - build-image-amd64
  script:
    - trivy image --exit-code 1 --severity HIGH,CRITICAL quay.io/rtraceio/flink:$CI_COMMIT_SHA-amd64-test

podman-pub-arm64:
  stage: publish
  image:
    name: quay.io/podman/stable
  tags:
    - saas-linux-small-arm64
  only:
    - tags
  script:
    - podman login -u="$QUAY_CR_USERNAME" -p="$QUAY_CR_PASSWORD" quay.io
    - podman build --build-arg="VERSION=$CI_COMMIT_TAG" --arch arm64 -t $IMAGE_NAME:$CI_COMMIT_TAG-arm64 -f Flink/Dockerfile .
    - podman push $IMAGE_NAME:$CI_COMMIT_TAG-arm64

podman-pub-amd64:
  stage: publish
  image:
    name: quay.io/podman/stable
  tags:
    - saas-linux-small-amd64
  only:
    - tags
  script:
    - podman login -u="$QUAY_CR_USERNAME" -p="$QUAY_CR_PASSWORD" quay.io
    - podman build --build-arg="VERSION=$CI_COMMIT_TAG" --arch amd64 -t $IMAGE_NAME:$CI_COMMIT_TAG-amd64 -f Flink/Dockerfile .
    - podman push $IMAGE_NAME:$CI_COMMIT_TAG-amd64

podman-publish-manifest:
  stage: publish
  needs:
    - podman-pub-arm64
    - podman-pub-amd64
  image:
    name: quay.io/podman/stable
  only:
    - tags
  script:
    - podman login -u="$QUAY_CR_USERNAME" -p="$QUAY_CR_PASSWORD" quay.io
    - podman manifest create $IMAGE_NAME:$CI_COMMIT_TAG
    - podman manifest add $IMAGE_NAME:$CI_COMMIT_TAG $IMAGE_NAME:$CI_COMMIT_TAG-amd64
    - podman manifest add $IMAGE_NAME:$CI_COMMIT_TAG $IMAGE_NAME:$CI_COMMIT_TAG-arm64
    - podman manifest push $IMAGE_NAME:$CI_COMMIT_TAG
    - podman manifest create $IMAGE_NAME:latest
    - podman manifest add $IMAGE_NAME:latest $IMAGE_NAME:$CI_COMMIT_TAG-amd64
    - podman manifest add $IMAGE_NAME:latest $IMAGE_NAME:$CI_COMMIT_TAG-arm64
    - podman manifest push $IMAGE_NAME:latest

build-executables:
  stage: publish
  image:
    name: $SDK_IMAGE
  only:
    - tags
  script:
    - chmod +x ./build-executables.sh
    - ./build-executables.sh
  artifacts:
    expire_in: never
    when: always
    paths:
      - $CI_PROJECT_DIR/release/*.zip
      - $CI_PROJECT_DIR/release/*.sha256
      - $CI_PROJECT_DIR/release/*.sha512

create-release:
  stage: publish
  image: registry.gitlab.com/gitlab-org/cli:latest
  only:
    - tags
    - /^(\d+\.\d+\.\d+)$/
  needs:
    - job: build-executables
      artifacts: true
  script:
    - echo "Creating GitLab Release for $CI_COMMIT_TAG"
    - glab auth login --job-token $CI_JOB_TOKEN
    - glab release create "$CI_COMMIT_TAG" --use-package-registry --ref "$CI_COMMIT_SHA" --name "$CI_COMMIT_TAG" --notes "Automated release for tag $CI_COMMIT_TAG" release/*
