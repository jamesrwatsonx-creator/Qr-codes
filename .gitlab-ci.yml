stages:
  - build
  - test
  - publish

build:
  stage: build
  image:
    name: mcr.microsoft.com/dotnet/sdk:9.0
  script:
    - dotnet build

unit-test:
  stage: test
  dependencies:
    - build
  image:
    name: mcr.microsoft.com/dotnet/sdk:9.0
  script:
    - apt-get update -y && apt-get install bc -y
    - cd Flink.UnitTests/
    - dotnet test -c Debug --results-directory ./cobertura --collect:"XPlat Code Coverage" --test-adapter-path:. --logger:"junit;LogFilePath=unit-test-result.xml;MethodFormat=Class;FailureBodyFormat=Verbose"
    - ../calc-codecov.sh "$CI_PROJECT_DIR/Flink.UnitTests/cobertura/"
  coverage: /TOTAL_COVERAGE=(\d+.\d+)/
  artifacts:
    when: always
    paths:
      - $CI_PROJECT_DIR/Flink.UnitTests/unit-test-result.xml
      - $CI_PROJECT_DIR/Flink.UnitTests/cobertura/**/coverage.cobertura.xml
    reports:
      junit:
        - $CI_PROJECT_DIR/Flink.UnitTests/unit-test-result.xml
      coverage_report:
        coverage_format: cobertura
        path: $CI_PROJECT_DIR/Flink.UnitTests/cobertura/**/coverage.cobertura.xml

integration-test:
  stage: test
  dependencies:
    - build
  image:
    name: mcr.microsoft.com/dotnet/sdk:9.0
  script:
    - apt-get update -y && apt-get install bc -y
    - cd Flink.IntegrationTests/
    - dotnet test -c Debug --results-directory ./cobertura --collect:"XPlat Code Coverage" --test-adapter-path:. --logger:"junit;LogFilePath=integration-test-result.xml;MethodFormat=Class;FailureBodyFormat=Verbose"
    - ../calc-codecov.sh "$CI_PROJECT_DIR/Flink.IntegrationTests/cobertura/"
  coverage: /TOTAL_COVERAGE=(\d+.\d+)/
  artifacts:
    when: always
    paths:
      - $CI_PROJECT_DIR/Flink.IntegrationTests/integration-test-result.xml
      - $CI_PROJECT_DIR/Flink.IntegrationTests/cobertura/**/coverage.cobertura.xml
    reports:
      junit:
        - $CI_PROJECT_DIR/Flink.IntegrationTests/integration-test-result.xml
      coverage_report:
        coverage_format: cobertura
        path: $CI_PROJECT_DIR/Flink.IntegrationTests/cobertura/**/coverage.cobertura.xml

podman-publish:
  stage: publish
  dependencies:
    - unit-test
    - integration-test
  image:
    name: quay.io/podman/stable
  only:
    - tags
  script:
    - podman login -u="$QUAY_CR_USERNAME" -p="$QUAY_CR_PASSWORD" quay.io
    - podman build --build-arg="VERSION=$CI_COMMIT_TAG" -t "quay.io/rtraceio/flink:latest" -t "quay.io/rtraceio/flink:$CI_COMMIT_TAG" -f Flink/Dockerfile .
    - podman push "quay.io/rtraceio/flink:latest"
    - podman push "quay.io/rtraceio/flink:$CI_COMMIT_TAG"

build-executables:
  stage: publish
  dependencies:
    - unit-test
    - integration-test
  image:
    name: mcr.microsoft.com/dotnet/sdk:9.0
  only:
    - tags
  script:
    - apt-get update -y && apt-get install zip -y
    - mkdir -p $CI_PROJECT_DIR/release
    - echo "Building Win-x86"
    - dotnet publish --self-contained -c Release /p:Version=$CI_COMMIT_TAG -r win-x86 -o $CI_PROJECT_DIR/release/win-x86 $CI_PROJECT_DIR/Flink/Flink.csproj
    - zip -r $CI_PROJECT_DIR/release/win-x86.zip $CI_PROJECT_DIR/release/win-x86/
    - echo "Building Win-x64"
    - dotnet publish --self-contained -c Release /p:Version=$CI_COMMIT_TAG -r win-x64 -o $CI_PROJECT_DIR/release/win-x64 $CI_PROJECT_DIR/Flink/Flink.csproj
    - zip -r $CI_PROJECT_DIR/release/win-x64.zip $CI_PROJECT_DIR/release/win-x64/
    - echo "Building Linux-x64"
    - dotnet publish --self-contained -c Release /p:Version=$CI_COMMIT_TAG -r linux-x64 -o $CI_PROJECT_DIR/release/linux-x64 $CI_PROJECT_DIR/Flink/Flink.csproj
    - zip -r $CI_PROJECT_DIR/release/linux-x64.zip $CI_PROJECT_DIR/release/linux-x64/
    - echo "Building Linux-ARM"
    - dotnet publish --self-contained -c Release /p:Version=$CI_COMMIT_TAG -r linux-arm -o $CI_PROJECT_DIR/release/linux-arm $CI_PROJECT_DIR/Flink/Flink.csproj
    - zip -r $CI_PROJECT_DIR/release/linux-arm.zip $CI_PROJECT_DIR/release/linux-arm/
    - echo "Building Linux-musl-x64"
    - dotnet publish --self-contained -c Release /p:Version=$CI_COMMIT_TAG -r linux-musl-x64 -o $CI_PROJECT_DIR/release/linux-musl-x64 $CI_PROJECT_DIR/Flink/Flink.csproj
    - zip -r $CI_PROJECT_DIR/release/linux-musl-x64.zip $CI_PROJECT_DIR/release/linux-musl-x64/
    - echo "Building MacOSX-x64"
    - dotnet publish --self-contained -c Release /p:Version=$CI_COMMIT_TAG -r osx-x64 -o $CI_PROJECT_DIR/release/osx-x64 $CI_PROJECT_DIR/Flink/Flink.csproj
    - zip -r $CI_PROJECT_DIR/release/osx-x64.zip $CI_PROJECT_DIR/release/osx-x64/
  artifacts:
    when: always
    paths:
      - $CI_PROJECT_DIR/release/win-x86.zip
      - $CI_PROJECT_DIR/release/win-x64.zip
      - $CI_PROJECT_DIR/release/linux-x64.zip
      - $CI_PROJECT_DIR/release/linux-arm.zip
      - $CI_PROJECT_DIR/release/linux-musl-x64.zip
      - $CI_PROJECT_DIR/release/osx-x64.zip
