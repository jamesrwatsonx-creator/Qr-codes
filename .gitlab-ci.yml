stages:
  - build
  - test
  - publish

build:
  stage: build
  image:
    name: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - dotnet build

unit-test:
  stage: test
  dependencies:
    - build
  image:
    name: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - cd Flink.UnitTests/
    - dotnet test -c Debug -r ./cobertura --collect:"XPlat Code Coverage" --test-adapter-path:. --logger:"junit;LogFilePath=unit-test-result.xml;MethodFormat=Class;FailureBodyFormat=Verbose"
  artifacts:
    when: always
    paths:
      - $CI_PROJECT_DIR/Flink.UnitTests/unit-test-result.xml
      - $CI_PROJECT_DIR/Flink.UnitTests/TestResults/**/coverage.cobertura.xml
    reports:
      junit:
        - $CI_PROJECT_DIR/Flink.UnitTests/unit-test-result.xml
      coverage_report:
        coverage_format: cobertura
        path: $CI_PROJECT_DIR/Flink.UnitTests/cobertura/**/coverage.cobertura.xml

      
integration-test:
  stage: test
  dependencies:
    - build
  image:
    name: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - cd Flink.IntegrationTests/
    - dotnet test -c Debug -r ./cobertura --collect:"XPlat Code Coverage" --test-adapter-path:. --logger:"junit;LogFilePath=integration-test-result.xml;MethodFormat=Class;FailureBodyFormat=Verbose"
  artifacts:
    when: always
    paths:
      - $CI_PROJECT_DIR/Flink.IntegrationTests/integration-test-result.xml
      - $CI_PROJECT_DIR/Flink.IntegrationTests/TestResults/**/coverage.cobertura.xml
    reports:
      junit:
        - $CI_PROJECT_DIR/Flink.IntegrationTests/integration-test-result.xml
      coverage_report:
        coverage_format: cobertura
        path: $CI_PROJECT_DIR/Flink.IntegrationTests/TestResults/**/coverage.cobertura.xml

podman-build:
  stage: publish
  dependencies:
    - unit-test
    - integration-test
  image:
    name: quay.io/podman/stable
  only:
    - tags
  script:
    - podman login -u "$QUAY_CR_USERNAME" -p "$QUAY_CR_PASSWORD" "quay.io"
    - podman build -t "quay.io/repository/flink-shortener/flink:latest" -t "quay.io/repository/flink-shortener/flink:$CI_COMMIT_TAG" -f Flink/Dockerfile
    - podman push "quay.io/repository/flink-shortener/flink:latest"
    - podman push "quay.io/repository/flink-shortener/flink:$CI_COMMIT_TAG"
