<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flink URL shortener</title>

  <link href="/static/img/favicon.ico" rel="icon" type="image/x-icon">
  <link href="/static/img/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180">
  <link href="/static/img/favicon-32x32.png" rel="icon" sizes="32x32" type="image/png">
  <link href="/static/img/favicon-16x16.png" rel="icon" sizes="16x16" type="image/png">

  <meta content="Flink, URL Shortener, Link Shortener, Shortener, Flinkify, Shorten Links, Bit.ly Alternative, FLOSS, QR Codes, Metadata, Embeds, iframes"
        name="keywords">
  <meta content="Flink is a F(L)OSS URL shortener built with ASP.NET, offering powerful link management with QR code generation, detailed analytics, and customizable embeds for rich link previews. Shorten, track, and share your links effortlessly. Try Flink today!"
        name="description">
  <meta content="Flink Team" name="author">
  <meta content="index, follow" name="robots">
  <meta content="general" name="rating">

  <meta content="Flink URL shortener" property="og:title"/>
  <meta content="Flink is a F(L)OSS URL shortener built with ASP.NET, featuring QR code generation, analytics, and customizable embeds for rich link previews."
        property="og:description"/>
  <meta content="https://gitlab.com/rtraceio/web/flink/-/raw/main/flink-logo.png" property="og:image"/>
  <meta content="https://gitlab.com/rtraceio/web/flink" property="og:url"/>
  <meta content="website" property="og:type"/>
  <meta content="Flink" property="og:site_name"/>
  <meta content="en_US" property="og:locale"/>

  <meta content="summary_large_image" name="twitter:card"/>
  <meta content="Flink URL Shortener" name="twitter:title"/>
  <meta content="Flink is a F(L)OSS URL shortener built with ASP.NET, featuring QR code generation, analytics, and customizable embeds for rich link previews."
        name="twitter:description"/>
  <meta content="https://gitlab.com/rtraceio/web/flink/-/raw/main/flink-logo.png" name="twitter:image"/>
  <meta content="https://gitlab.com/rtraceio/web/flink" name="twitter:url"/>

  <link href="/themes/flink-default/index.css" rel="stylesheet"/>
</head>
<body>
<nav>
  <a href="/scalar">📎 scalar</a>
  <a href="/swagger">📜 swagger</a>
  <a href="/stats">📈 stats</a>
  <a class="small" href="https://gitlab.com/rtraceio/web/Flink">⌨️ source</a>
</nav>
<div class="flink-form">
  <img alt="Flink Logo" class="flink-logo-img" src="/static/img/flink-logo.png"/>
  <section class="input-area">
    <input class="url-textbox" id="input-url" maxlength="1000" minlength="11" placeholder="enter URL to shorten"
           type="url">
    <button id="shorten-action">🦔 flinkify</button>
  </section>

  <p class="status-text" id="status-text"></p>
  <input class="url-textbox" id="output-url" readonly style="display: none;" type="url"/>

  <section class="output-area">
    <img alt="QR Code for your URL" id="output-qr-code" src="" style="display: none;">
    <div class="loader" id="embed-loader" style="display: none;"></div>
    <iframe id="embed-output" style="display: none;"></iframe>
  </section>
</div>

<!-- UI JS -->
<script src="/static/flink-core-api.js"></script>
<script src="/static/flink-core-ui.js"></script>
<script src="/themes/flink-default/flink-default.js"></script>
</body>
</html>
